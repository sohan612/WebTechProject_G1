
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <link rel="stylesheet" href="style.css">

    <script src="data.js" defer></script>
    <script src="common.js" defer></script>
    <script src="admin.js" defer></script>
    
    <script src="access.js"></script>
    <script>
       checkAdmin();
</script>  
</head>

<body>

    <header>
        <h1>Shopping Management System</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main class="admin-container">

        <h2>Admin Panel</h2>
        <p>Manage your shopping products here.</p>

        <!-- Add Product Form,, -->

        <section class="admin-form">

            <h3>Add New Product</h3>

            <form id="productForm">

                <label for="productName">Product Name</label>
                <input type="text" id="productName"
                    placeholder="Enter product name" required>

                <label for="productPrice">Product Price</label>
                <input type="number" id="productPrice"
                    placeholder="Enter product price"
                    min="0.01" step="0.01" required>

                <label for="productCategory">Product Category</label>
                <select id="productCategory" required>
                    <option value="">Select Category</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Food">Food</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Others">Others</option>
                </select>

                <label for="productImage">Product Image URL</label>
                <input type="text" id="productImage"
    placeholder="Enter image path (e.g. images/faceMask.jpg)">

                <button type="submit" class="add-product-btn">
                    Add Product
                </button>

            </form>

        </section>

        <!-- Product List -->

        <section class="admin-products">

            <h3>Manage Products</h3>

            <div id="adminProductList" class="admin-product-grid">
                <!-- Products will appear here -->
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Shopping Management System</p>
    </footer>

</body>
</html>
