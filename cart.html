
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">
    <script src="data.js" defer></script>
    <script src="common.js" defer></script>
    <script src="cart.js" defer></script>
</head>

<body>

    <header>
        <h1>Shopping Management System</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main class="cart-container">

        <h2>My Shopping Cart</h2>

        <div class="cart-layout">

            <section class="cart-items-section">

                <div id="cartItems">
                    <!-- Cart products will appear here -->
                </div>

                <button id="clearCartBtn" class="clear-btn">
                    Clear Cart
                </button>

            </section>

            <section class="cart-summary">

                <h3>Order Summary</h3>

                <div class="summary-row">
                    <span>Total Items:</span>
                    <span id="totalItems">0</span>
                </div>

                <div class="summary-row">
                    <span>Total Amount:</span>
                    <span id="totalAmount">৳0.00</span>
                </div>

                <button id="checkoutBtn" class="checkout-btn">
                    Proceed to Checkout
                </button>

                <a href="products.html" class="continue-btn">
                    Continue Shopping
                </a>

            </section>

        </div>

    </main>

    <footer>
        <p>© 2026 Shopping Management System</p>
    </footer>

</body>
</html>
